[versions]
agp = "9.3.2"
kotlin = "2.4.10"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
media3Exoplayer = "1.11.0"
media3Session = "1.11.0"
compose = "1.12.0"
kotlinx-serialization = "2.4.10"
icu4j = "78.3"
benchmark = "1.5.0"
lyricsCore = "0.5.0"
lyricsPhonetics = "0.1.0"

[libraries]
androidx-benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version = "1.4.1" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.4.0" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
kotlinx-coroutines-guava = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version = "1.11.0" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3Exoplayer" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3Session" }
accompanist-lyrics-core = { module = "com.mocharealm.accompanist:lyrics-core", version.ref = "lyricsCore" }
accompanist-lyrics-phonetics-runtime = { module = "com.mocharealm.accompanist:lyrics-phonetics-runtime", version.ref = "lyricsPhonetics" }
accompanist-lyrics-phonetics-data-mandarin = { module = "com.mocharealm.accompanist:lyrics-phonetics-data-mandarin", version.ref = "lyricsPhonetics" }
accompanist-lyrics-phonetics-data-cantonese = { module = "com.mocharealm.accompanist:lyrics-phonetics-data-cantonese", version.ref = "lyricsPhonetics" }
accompanist-lyrics-phonetics-data-japanese = { module = "com.mocharealm.accompanist:lyrics-phonetics-data-japanese", version.ref = "lyricsPhonetics" }
gaze-capsule = { module = "com.mocharealm.gaze:capsule", version = "2.1.1-patch2" }
koin-bom = { group = "io.insert-koin", name = "koin-bom", version = "4.2.2" }
koin-compose = { group = "io.insert-koin", name = "koin-compose" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel" }
cloudy = { module = "com.github.skydoves:cloudy", version = "0.7.1" }
tinyPinyin = { module = "com.github.promeg:tinypinyin", version = "2.0.3" }
icu4j = { group = "com.ibm.icu", name = "icu4j", version.ref = "icu4j" }

[plugins]
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
jetbrains-kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinx-serialization" }
maven-publish = { id = "com.vanniktech.maven.publish.base", version = "0.35.0" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version = "0.10.0" }
dokka = { id = "org.jetbrains.dokka", version = "2.1.0" }
