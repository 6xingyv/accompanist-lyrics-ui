[package]
name = "lyrics-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "desktop_lyrics"
path = "src/bin/desktop_lyrics.rs"

[dependencies]
env_logger = "0.11"
glutin = "0.32.3"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "bmp",
    "gif",
    "tiff",
    "ico",
] }
lyrics-parser = { path = "../lyrics-parser" }
lyrics-renderer = { path = "../lyrics-renderer" }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skia-safe = { version = "0.99.0", features = ["gl"] }
tao = "0.35.3"
unicode-segmentation = "1.12"

[target.'cfg(windows)'.dependencies]
sysinfo = "0.33"
wasapi = "0.23"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
