[package]
name = "text_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "text_engine"
crate-type = ["cdylib", "staticlib"]

[dependencies]
jni = "0.19"
libc = "0.2"
log = "0.4"
lyrics-renderer = { path = "../lyrics-renderer" }
once_cell = "1.19.0"
serde_json = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
android_log = "0.1"
ash = "0.37.3"
skia-safe = { version = "0.99.0", features = ["gl", "vulkan"] }
