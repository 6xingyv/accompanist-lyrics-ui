[package]
name = "lyrics-renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
cosmic-text = "0.19.0"
euclid = "0.22.11"
libc = "0.2"
log = "0.4"
memmap2 = "0.9"
num-complex = "0.4"
once_cell = "1.19.0"
rustfft = "6.4.1"
rustybuzz = "0.18.0"
sdf_glyph_renderer = "1.0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skia-safe = "0.99.0"
swash = { version = "0.1.19", features = ["scale"] }
unicode-script = "0.5.8"
unicode-segmentation = "1.12"
