name: Release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    uses: ./.github/workflows/build.yml
    with:
      release: true
    secrets: inherit

  publish:
    needs: packages
    runs-on: macos-26
    environment: android-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Publish all library targets to Maven Central
        env:
          VERSION: ${{ needs.packages.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" || -z "$ORG_GRADLE_PROJECT_mavenCentralPassword" || -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]]; then
            echo '::error::Maven Central credentials and a signing key are required.'
            exit 1
          fi
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" ]]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKeyId
          fi
          bash ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' "-PreleaseVersion=$VERSION" :src:publishToMavenCentral

  release:
    needs: [packages, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lyrics-ui-${{ needs.packages.outputs.version }}-*
          merge-multiple: true
          path: dist
      - name: Verify assets and write checksums
        env:
          VERSION: ${{ needs.packages.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          expected = [f'lyrics-ui-{version}-maven.zip']
          expected += [f'lyrics-ui-sample-{version}-{platform}.{suffix}' for platform, suffix in [
              ('windows-x64', 'exe'), ('macos-arm64', 'dmg'), ('macos-x64', 'dmg'),
              ('linux-x64', 'flatpak'), ('ios-arm64-unsigned', 'ipa'),
              ('android-arm64-v8a-release', 'apk'), ('android-armeabi-v7a-release', 'apk')]]
          missing = [name for name in expected if not (Path('dist') / name).is_file()]
          if missing:
              raise SystemExit(f'Missing release assets: {missing}')
          PY
          (cd dist && sha256sum -- *.apk *.exe *.dmg *.flatpak *.ipa *.zip > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.packages.outputs.prerelease }}
        shell: bash
        run: |
          # Attach every platform package before publishing the immutable release.
          if gh release view "$TAG" --json isDraft > release.json; then
            if [[ "$(jq -r .isDraft release.json)" != true ]]; then
              echo '::error::This tag already has a published release; refusing to replace its assets.'
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
